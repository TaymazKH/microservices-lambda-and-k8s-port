apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  labels:
    app: ad-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ad-service
  template:
    metadata:
      labels:
        app: ad-service
    spec:
      containers:
        - name: server
          image: ghcr.io/taymazkh/ad-service:latest
          ports:
            - containerPort: 9555
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
