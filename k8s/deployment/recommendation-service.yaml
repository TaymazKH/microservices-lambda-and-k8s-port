apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  labels:
    app: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: server
          image: ghcr.io/taymazkh/recommendation-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "http://product-catalog-service:3550"
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
