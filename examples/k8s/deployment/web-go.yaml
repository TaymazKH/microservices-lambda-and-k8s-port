apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: server
          image: ghcr.io/taymazkh/web-go:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
